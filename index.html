 <body data-template-id="__page-root" class="w-full">
  <div class="stage">
   <div class="frame">

    </header>
    <main>
     <section class="grid grid-cols-2 gap-3 sm:gap-5 mb-6" aria-label="Skor tim">

       </div>
      </div>
      <div id="team-1" class="score-card rounded-2xl p-4 sm:p-5">
       <p data-template-id="team-two-label" class="canva-text uppercase tracking-widest opacity-80"></p>
       <div id="score-1" class="text-4xl sm:text-5xl font-extrabold tabular-nums" aria-label="Skor Tim 2">
        0
       </div>

     </section>

      </div>
      <div class="beam mb-6"></div>
      <div id="answers" class="grid sm:grid-cols-2 gap-3" aria-label="Papan jawaban"></div>
      <div class="mt-6 flex flex-wrap items-center justify-between gap-2">

      </div>
     </section>
     <section class="mt-7 max-w-2xl mx-auto">

       <label data-template-id="guess-label" class="canva-text sr-only" for="guess"></label> <input id="guess" type="text" autocomplete="off" required maxlength="80" data-template-id="guess-input" class="canva-input w-full rounded-xl px-5 py-4 bg-white text-[#152467] font-semibold placeholder:text-slate-500 border-2 border-transparent focus:border-amber-300"> <button id="guess-button" data-template-id="guess-button" type="submit" class="canva-button gold-button rounded-xl px-9 py-4 whitespace-nowrap"></button>
      </form>
      <p id="message" class="text-center mt-4 min-h-[28px] font-bold text-amber-100" role="status" aria-live="polite"></p>
      <div class="flex flex-wrap justify-center gap-3 mt-4">
       <button id="skip" data-template-id="skip-button" type="button" class="canva-button secondary rounded-xl px-5 py-3 font-bold"></button> <button id="next" data-template-id="next-button" type="button" class="canva-button gold-button rounded-xl px-5 py-3 hidden"></button> <button id="restart" data-template-id="restart-button" type="button" class="canva-button secondary rounded-xl px-5 py-3 font-bold"></button>
      </div>
     </section>
    </main>

  <script>
    const rounds = [
      {q:"Sebutkan benda yang sering lupa dibawa saat keluar rumah.", a:[["HP",35,["handphone","ponsel","telepon","hape"]],["Dompet",25,["wallet"]],["Kunci",20,["kunci rumah","kunci mobil"]],["Payung",12,[]],["Botol minum",8,["botol air","air minum"]]]},
      {q:"Apa yang biasa dilakukan orang saat listrik padam?", a:[["Menyalakan senter",30,["senter","pakai senter"]],["Mencari lilin",25,["lilin","nyalakan lilin"]],["Mengecek tetangga",20,["tetangga","cek tetangga"]],["Bermain HP",15,["main hp","hp","handphone"]],["Tidur",10,[]]]},
      {q:"Sebutkan makanan yang sering ada saat Lebaran.", a:[["Ketupat",35,[]],["Opor ayam",30,["opor"]],["Rendang",15,[]],["Sambal goreng ati",12,["sambal goreng hati","ati"]],["Kue kering",8,["nastar","kue"]]]},
      {q:"Apa alasan seseorang terlambat datang?", a:[["Macet",40,["kemacetan"]],["Bangun kesiangan",25,["kesiangan","telat bangun"]],["Kendaraan bermasalah",15,["kendaraan rusak","motor mogok","ban bocor"]],["Hujan",12,[]],["Lupa jadwal",8,["lupa waktu"]]]},
      {q:"Sebutkan kegiatan saat kumpul keluarga.", a:[["Makan bersama",35,["makan","makan bareng"]],["Mengobrol",30,["ngobrol","berbincang"]],["Foto bersama",15,["foto","berfoto"]],["Bermain gim",12,["main game","bermain game","main gim"]],["Menonton TV",8,["nonton tv","televisi"]]]}
    ];
    let roundIndex=0, team=0, scores=[0,0], strikes=0, found=new Set(), finished=false, muted=false, audioCtx;
    const $=id=>document.getElementById(id);
    const normalize=s=>s.toLocaleLowerCase('id-ID').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
    function tone(success) {
      if(muted) return;
      try {
        audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
        if(audioCtx.state==='suspended') audioCtx.resume();
        const now=audioCtx.currentTime;
        (success?[523,659,784]:[220,165]).forEach((freq,i)=>{
          const osc=audioCtx.createOscillator(), gain=audioCtx.createGain(), start=now+i*.105;
          osc.type=success?'sine':'sawtooth'; osc.frequency.value=freq;
          gain.gain.setValueAtTime(.0001,start); gain.gain.exponentialRampToValueAtTime(.12,start+.015);
          gain.gain.exponentialRampToValueAtTime(.0001,start+.20);
          osc.connect(gain).connect(audioCtx.destination); osc.start(start); osc.stop(start+.21);
        });
      } catch(e) { /* Audio is optional if unavailable. */ }
    }
    function announce(text){ $('message').textContent=text; }
    function renderBoard(){
      const board=$('answers'); board.replaceChildren();
      rounds[roundIndex].a.forEach((item,i)=>{
        const row=document.createElement('div');
        row.className='answer'+(found.has(i)?' revealed':'');
        const num=document.createElement('span');num.className='number';num.textContent=i+1;
        const label=document.createElement('span');label.className='flex-1 font-bold text-base sm:text-lg';
        label.textContent=found.has(i)?item[0]:'••••••••••';
        const points=document.createElement('span');points.className='font-extrabold text-xl tabular-nums';
        points.textContent=found.has(i)?item[1]:'';
        row.append(num,label,points);board.append(row);
      });
    }
    function render(){
      $('round').textContent='BABAK '+(roundIndex+1)+' / '+rounds.length;
      $('question').textContent=rounds[roundIndex].q;
      $('score-0').textContent=scores[0];$('score-1').textContent=scores[1];
      $('team-0').classList.toggle('active',team===0);
      $('team-1').classList.toggle('active',team===1);
      $('turn').textContent=finished?'Babak selesai':'Giliran Tim '+(team+1);
      $('strikes').textContent='SALAH: '+ '✕ '.repeat(strikes).trim()+'○ '.repeat(3-strikes).trim();
      $('guess').disabled=finished;$('guess-button').disabled=finished;$('skip').disabled=finished;
      $('next').classList.toggle('hidden',!finished);
      renderBoard();
    }
    function switchTeam(){team=1-team;strikes=0;}
    $('guess-form').addEventListener('submit',e=>{
      e.preventDefault();
      if(finished)return;
      const value=normalize($('guess').value); if(!value)return;
      const index=rounds[roundIndex].a.findIndex((a,i)=>!found.has(i)&&[a[0],...a[2]].some(v=>normalize(v)===value));
      $('guess').value='';
      if(index>=0){
        found.add(index); scores[team]+=rounds[roundIndex].a[index][1]; tone(true);
        announce('Benar! '+rounds[roundIndex].a[index][1]+' poin untuk Tim '+(team+1)+'.');
        if(found.size===rounds[roundIndex].a.length){
          finished=true;
          announce(roundIndex===rounds.length-1?'Semua jawaban ditemukan! Lihat skor akhir, atau main lagi.':'Semua jawaban ditemukan! Lanjut ke babak berikutnya.');
        }
      } else {
        strikes++;tone(false);
        if(strikes===3){switchTeam();announce('Tiga kali salah! Sekarang giliran Tim '+(team+1)+'.');}
        else announce('Belum tepat. Coba jawaban lain!');
      }
      render();
    });
    $('skip').addEventListener('click',()=>{switchTeam();announce('Giliran berpindah ke Tim '+(team+1)+'.');render();$('guess').focus();});
    $('next').addEventListener('click',()=>{
      if(roundIndex>=rounds.length-1){announce('Ini babak terakhir. Tekan Main Lagi untuk mengulang.');return;}
      roundIndex++;found.clear();strikes=0;finished=false;team=1-team;
      announce('Babak baru dimulai. Giliran Tim '+(team+1)+'.');render();$('guess').focus();
    });
    $('restart').addEventListener('click',()=>{
      roundIndex=0;team=0;scores=[0,0];strikes=0;found.clear();finished=false;
      announce('Permainan baru dimulai. Giliran Tim 1!');render();$('guess').focus();
    });
    $('sound').addEventListener('click',()=>{
      muted=!muted;$('sound').setAttribute('aria-pressed',String(!muted));
      $('sound-on').classList.toggle('hidden',muted);
      $('sound-off').classList.toggle('hidden',!muted);
      if(!muted)tone(true);
    });
    render();announce('Giliran Tim 1. Masukkan tebakan pertama!');
  </script>
